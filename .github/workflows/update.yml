name: Update gas curve

on:
  schedule:
    - cron: "0 18 * * 4"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install requests matplotlib

      - name: Write API key from secret
        run: echo "EIA_API_KEY=${{ secrets.EIA_API_KEY }}" > .env

      - name: Fetch data
        run: python fetch.py

      - name: Analyse
        run: python analyze.py

      - name: Make chart
        run: python make_chart.py

      - name: Commit any changes
        run: |
          rm -f .env
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data output
          git diff --staged --quiet || git commit -m "Weekly data refresh"
          git push